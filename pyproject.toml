[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent-platform"
version = "0.1.0"
description = "A LangGraph-based multi-agent research system."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "langchain>=0.3,<2.0",
    "langchain-openai>=0.2,<2.0",
    "langgraph>=0.2,<2.0",
    "langgraph-checkpoint-postgres>=3.1,<4.0",
    "langsmith>=0.2,<1.0",
    "jsonschema>=4.23,<5.0",
    "mcp>=1.2,<2.0",
    "openai>=1.57,<3.0",
    "pgvector>=0.3,<1.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "structlog>=24.4,<26.0",
    "tavily-python>=0.5,<1.0",
    "tenacity>=9.0,<10.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]
rag = [
    "FlagEmbedding>=1.3,<2.0",
    "sentence-transformers>=3.3,<6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*",
    "api*",
    "core*",
    "evidence*",
    "graph*",
    "guardrail*",
    "memory*",
    "rag*",
    "tools*",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
