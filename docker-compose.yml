name: research-agent

services:
  api:
    build:
      context: .
      args:
        INSTALL_RAG: ${INSTALL_RAG:-false}
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      SMALL_MODEL: ${SMALL_MODEL:-}
      LARGE_MODEL: ${LARGE_MODEL:-}
      STRUCTURED_OUTPUT_METHOD: ${STRUCTURED_OUTPUT_METHOD:-json_schema}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-60}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
      MAX_AGENT_CONTEXT_CHARS: ${MAX_AGENT_CONTEXT_CHARS:-16000}
      DYNAMIC_MODEL_ROUTING: ${DYNAMIC_MODEL_ROUTING:-true}
      MODEL_ROUTER_COMPLEXITY_CHARS: ${MODEL_ROUTER_COMPLEXITY_CHARS:-4000}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TOOLS_ENABLED: ${TOOLS_ENABLED:-false}
      TOOL_PERMISSIONS: ${TOOL_PERMISSIONS:-search:execute,knowledge_base:read,database:read}
      SEARCH_MAX_CALLS_PER_RUN: ${SEARCH_MAX_CALLS_PER_RUN:-100}
      SEARCH_MAX_CALLS_PER_TASK: ${SEARCH_MAX_CALLS_PER_TASK:-10}
      RESEARCH_QUALITY_GATE_ENABLED: ${RESEARCH_QUALITY_GATE_ENABLED:-true}
      RESEARCH_INITIAL_SEARCHES: ${RESEARCH_INITIAL_SEARCHES:-5}
      RESEARCH_FOLLOWUP_BATCH_SIZE: ${RESEARCH_FOLLOWUP_BATCH_SIZE:-2}
      RESEARCH_MAX_SEARCHES_PER_TASK: ${RESEARCH_MAX_SEARCHES_PER_TASK:-10}
      RESEARCH_COMPLETION_SCORE: ${RESEARCH_COMPLETION_SCORE:-80}
      RESEARCH_MIN_UNIQUE_SOURCES: ${RESEARCH_MIN_UNIQUE_SOURCES:-5}
      RESEARCH_MIN_INDEPENDENT_DOMAINS: ${RESEARCH_MIN_INDEPENDENT_DOMAINS:-3}
      RESEARCH_MAX_TOOL_ROUNDS: ${RESEARCH_MAX_TOOL_ROUNDS:-3}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-10000}
      DATABASE_TOOL_ENABLED: ${DATABASE_TOOL_ENABLED:-false}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-3}
      DATABASE_MAX_ROWS: ${DATABASE_MAX_ROWS:-100}
      RECOVERY_ENABLED: ${RECOVERY_ENABLED:-true}
      RECOVERY_MAX_TOOL_RETRIES: ${RECOVERY_MAX_TOOL_RETRIES:-2}
      RECOVERY_MAX_TASK_REPLANS: ${RECOVERY_MAX_TASK_REPLANS:-1}
      RECOVERY_BACKOFF_SECONDS: ${RECOVERY_BACKOFF_SECONDS:-0.25}
      SAGA_BACKEND: ${SAGA_BACKEND:-postgres}
      SAGA_AUTO_SETUP: ${SAGA_AUTO_SETUP:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER:-research_agent}:${POSTGRES_PASSWORD:-research_agent}@postgres:5432/${POSTGRES_DB:-research_agent}
      CHECKPOINT_BACKEND: ${CHECKPOINT_BACKEND:-postgres}
      CHECKPOINT_AUTO_SETUP: ${CHECKPOINT_AUTO_SETUP:-true}
      BLACKBOARD_BACKEND: ${BLACKBOARD_BACKEND:-postgres}
      LONG_TERM_MEMORY_BACKEND: ${LONG_TERM_MEMORY_BACKEND:-postgres}
      EPISODIC_MEMORY_BACKEND: ${EPISODIC_MEMORY_BACKEND:-postgres}
      MEMORY_COMPRESSION_CHARS: ${MEMORY_COMPRESSION_CHARS:-8000}
      MEMORY_MIN_VALUE_SCORE: ${MEMORY_MIN_VALUE_SCORE:-0.2}
      MEMORY_MAX_RECORDS_PER_USER: ${MEMORY_MAX_RECORDS_PER_USER:-1000}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_BACKEND: ${RAG_BACKEND:-postgres}
      BGE_M3_MODEL: ${BGE_M3_MODEL:-BAAI/bge-m3}
      BGE_RERANKER_MODEL: ${BGE_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      BGE_DEVICE: ${BGE_DEVICE:-cpu}
      BGE_USE_FP16: ${BGE_USE_FP16:-false}
      RAG_CANDIDATE_K: ${RAG_CANDIDATE_K:-30}
      RAG_TOP_K: ${RAG_TOP_K:-8}
      RAG_RRF_K: ${RAG_RRF_K:-60}
      RAG_CONTEXT_CHARS: ${RAG_CONTEXT_CHARS:-12000}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-research-agent-local}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research_agent}
      POSTGRES_USER: ${POSTGRES_USER:-research_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research_agent}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-research_agent} -d ${POSTGRES_DB:-research_agent}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
